# The channel layer of the knowledge base.
#
# One entry per broadcaster, grouped by the national pack it hangs under.
# Every entry becomes a selectable jurisdiction node that inherits its
# country's rules (and through it, the continental and global ones), so a
# channel is analysable the day its name is added here.
#
# A channel with rules of its own gets a real pack file instead
# (markets/BE-VRT.yaml is the worked example) and that file wins: this
# registry only supplies the nodes nobody has written rules for yet.
#
# ponytail: names-only is the honest state of this table. Adding a rule to a
# channel means writing its pack file, not editing this list.
