# Runs the test suite on every push and pull request.
#
# Nothing here can reach production: this job has no credentials, no Google
# Cloud access and no ability to deploy. It installs the project, runs the
# tests, and reports a tick or a cross on the commit. Deploys still only
# happen when somebody runs scripts/deploy.sh.
#
# Two groups of tests are deselected, both on purpose and both named:
#   live       hits real network services, so it needs credentials
#   needs_env  passes on a machine holding a .env and fails on a clean
#              clone. The coupling is real and not yet fixed; skipping it
#              here keeps green meaning "everything hermetic passes"
#              rather than "somebody stopped reading the red".
name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # the media tests shell out to it: shot detection, keyframes, the
      # craft gate. Without it eighty-odd tests fail on "ffmpeg not found"
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run the suite
        run: python -m pytest tests -q -m "not live and not needs_env"
