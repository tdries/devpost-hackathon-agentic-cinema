# Planted compliance triggers in trigger_reel_a.mp4 and trigger_reel_b.mp4.
#
# Companion to landmines.yaml, which is the ground truth for test_ad.mp4.
# These two reels exist for one reason: the corpus this project owns tripped
# 8 of the taxonomy's 18 dimensions, and a clearance tool that can only
# demonstrate the categories its own footage happens to contain is
# demonstrating its footage. Each shot below carries one trigger that
# nothing in the reel had.
#
# Built with Gemini Omni rather than Veo, and the arithmetic is the reason:
# Veo generates from nothing at EUR 0.45 a second with a four second floor
# (seven shots, EUR 12.60 before a retry), while Omni rewrites footage that
# already exists at EUR 0.10 a second (EUR 2.80). Actual spend: EUR 3.40,
# which is six injections at EUR 0.40, three retries, and two refusals that
# cost nothing. Every frame is derived from this project's own Veo reel, so
# nothing here is anybody else's footage.
#
# Schema, one entry per shot:
#   shot      order in the assembled mp4, from 1
#   t_approx  seconds into the reel where the trigger is visible
#   dimension one value from markets/_taxonomy.yaml
#   inject    what Omni was asked to put there
#   expects   rule ids that SHOULD fire, from packs that exist today
#   markets   the markets that have to be selected for `expects` to be
#             reachable at all. This is the lesson of the first pass:
#             violence was observed thirty-one times in test_ad and never
#             fired, because a trigger nobody's rulebook covers is a shot
#             nobody objects to.
#
# `expects` is deliberately conservative: only rules whose trigger text
# plainly covers what is on screen. An empty list on the control shots means
# nothing should fire, and a finding there is a false positive worth
# investigating.

# WHAT ACTUALLY FIRED, cleared on the live instance 2026-09-07:
#   reel a  run_edd9356048af  8 markets, 24 findings, 4 of 8 cleared
#   reel b  run_6d490151b6be  8 markets, 19 findings, 4 of 8 cleared
# Corpus-wide the taxonomy went from 8 of 18 categories triggering a real
# rule to 15 of 18. `fired` on each shot below is the measured outcome,
# not the hope.

reel_a:
  file: trigger_reel_a.mp4
  run: run_edd9356048af
  duration_s: 16.7
  shots:
    - shot: 1
      t_approx: 2
      dimension: children_and_minors
      inject: >-
        A cartoon fox mascot in a cape waving beside the notepad, and
        COLLECT ALL SIX in a crayon font across the bottom of frame.
      expects: [GL-CHILD-01, UK-CHILD-01, BE-VRT-KIDS-01]
      markets: [GLOBAL, UK, BE-VRT]
      fired: borderline
      note: >-
        No minor is depicted and none is needed: GL-CHILD-01 is about
        exploiting the credulity of children, which a mascot and a
        collect-them-all line do on their own.

    - shot: 2
      t_approx: 6
      dimension: food_and_animals
      inject: A white plate of sliced cured ham and bacon on the desk.
      expects: [AE-FOOD-01, SA-FOOD-01]
      markets: [AE, SA]
      fired: [AE-FOOD-01, SA-FOOD-01]

    - shot: 3
      t_approx: 10
      dimension: violence_and_weapons
      inject: >-
        A gloved hand pressing a revolver against the bottle and firing,
        the bottle shattering. Nobody present, nobody hurt.
      expects: [US-VIOL-01, DE-WR-01, UK-VIOL-01, FR-VIOL-01]
      markets: [US, DE, UK, FR]
      fired: [US-VIOL-01, DE-WR-01, UK-VIOL-01, FR-VIOL-01]
      note: >-
        The second attempt. The first put a revolver on a bar counter in a
        shot of a runner, and Omni returned the footage essentially
        unchanged: a weapon lying about is not the "gratuitous or realistic"
        depiction DE, FR and UK all ask for.

    - shot: 4
      t_approx: 13
      dimension: gender_portrayal
      inject: >-
        On-screen copy reading FOR THE MAN WHO EARNED IT. ASK HER TO POUR.
      expects: [BE-GENDER-01, FR-GEND-01, US-GEND-01]
      markets: [BE-VRT, FR, US]
      fired: [BE-GENDER-01, FR-GEND-01, US-GEND-01, DE-DISC-01, SA-GEND-01]
      note: >-
        Also the second attempt, and the interesting refusal of the whole
        exercise. Asking Omni to pose a photorealistic woman as decorative
        set dressing was refused at the output: "reputational harms to
        photorealistic individuals". Reducing a person to an object IS a
        reputational harm, so the stereotype went into the copy instead --
        which is where a viewer meets it anyway.

    - shot: 5
      t_approx: 15
      dimension: null
      inject: null
      expects: []
      markets: []
      note: Control. Unedited source footage; nothing should fire here.

reel_b:
  file: trigger_reel_b.mp4
  run: run_6d490151b6be
  duration_s: 16.1
  shots:
    - shot: 1
      t_approx: 2
      dimension: gambling_and_finance
      inject: >-
        A phone beside the bottle showing an online casino: roulette wheel,
        betting odds, and a DOUBLE YOUR MONEY button.
      expects: [AE-GAM-01, SA-GAM-01, CN-GAM-01, DE-GAM-01, UK-GAM-01]
      markets: [AE, SA, CN, DE, UK]
      fired: [AE-GAM-01, SA-GAM-01, CN-GAM-01, DE-GAM-01, UK-GAM-01, US-GAM-01, FR-GAM-01]
      note: >-
        The one dimension nothing in the corpus had ever even been observed
        in. Also the injection that taught the reel where people can and
        cannot be: putting this next to photorealistic drinkers was refused,
        and the product-on-white shot accepted it immediately.

    - shot: 2
      t_approx: 6
      dimension: national_symbols_politics
      inject: >-
        The national flag of the People's Republic of China as the
        product's backdrop.
      expects: [CN-NAT-01]
      markets: [CN]
      fired: [CN-NAT-01]
      note: >-
        Second attempt, and the trigger-text lesson twice over: the first
        pass asked for "a national flag", got the Stars and Stripes, and
        would have fired nothing at all. CN-NAT-01 covers the flag of the
        market whose pack it is in; no US rule covers a flag as set
        dressing.

    - shot: 3
      t_approx: 10
      dimension: religious_symbols_practices
      inject: >-
        A crucifix pendant hung over the neck of the bottle as a
        decorative sales tag.
      expects: [AE-REL-01, SA-REL-01]
      markets: [AE, SA]
      fired: [AE-REL-01, SA-REL-01]

    - shot: 4
      t_approx: 14
      dimension: null
      inject: null
      expects: []
      markets: []
      note: Control. Unedited source footage; nothing should fire here.

# The three dimensions still cold, and the assumption that was wrong.
#
# The plan was that these needed no footage, because their rules live in
# markets the showcase run had never selected. So the showcase run was
# re-judged against US, CN and JP for the price of a Gemini call, and all
# three stayed cold. Measured afterwards:
#
#   humour_irony_satire        observed only in test.mp4 and a phone clip,
#                              never in test_ad or these reels: this run has
#                              no observation for anyone to judge
#   language_profanity_idiom   observed in test_ad and reel a, judged
#                              against US, and no rule fired: an idiom that
#                              translates cleanly is not profanity
#   superstition_number_colour observed in test_ad and reel b, judged
#                              against CN and JP, and no rule fired: the
#                              rules want the number four or a funeral
#                              colour in a market that reads it that way
#
# Which is the same lesson as the knife and the wrong flag, a third time: a
# market with the rule and an observation in the dimension are both
# necessary and neither is sufficient. Finishing these three needs footage
# that plainly meets the trigger -- an actual expletive on screen, a joke at
# a group's expense, the number four in a Chinese context -- which is three
# more Omni spans at EUR 0.40 each.
