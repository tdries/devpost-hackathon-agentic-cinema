# The crew's own dashboards, baked in from grafana/dashboards/ -- the same
# JSON the Publisher agent pushes to Grafana Cloud over MCP.
apiVersion: 1

providers:
  - name: customs
    type: file
    disableDeletion: true
    allowUiUpdates: false
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
