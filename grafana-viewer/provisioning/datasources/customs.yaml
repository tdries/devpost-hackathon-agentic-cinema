# The same data the crew writes, read directly from Grafana Cloud.
#
# NOT through the stack's datasource proxy: that works (verified), but it
# would mean carrying the stack's ADMIN service account token inside a
# public, anonymous Grafana. These credentials are a purpose-minted access
# policy instead -- logs:read + metrics:read only, pinned by labelPolicy to
# {app="customs"}, and refused (401) by grafana.com's account API.
#
# The UIDs are Cloud's own on purpose: every dashboard JSON in this repo
# names grafanacloud-logs (14x) and grafanacloud-prom (27x), so keeping the
# UIDs means the crew's dashboards provision here unmodified.
apiVersion: 1

datasources:
  - name: Loki
    uid: grafanacloud-logs
    type: loki
    access: proxy
    url: ${LOKI_URL}
    basicAuth: true
    basicAuthUser: ${LOKI_USER}
    editable: false
    secureJsonData:
      basicAuthPassword: ${VIEWER_TOKEN}

  - name: Mimir
    uid: grafanacloud-prom
    type: prometheus
    access: proxy
    url: ${PROM_URL}
    basicAuth: true
    basicAuthUser: ${PROM_USER}
    isDefault: true
    editable: false
    jsonData:
      httpMethod: GET
    secureJsonData:
      basicAuthPassword: ${VIEWER_TOKEN}
