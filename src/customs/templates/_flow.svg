{# The flow, from the moment a master lands, and it can be played.

   Hand-drawn SVG rather than a picture of a diagram: it scales, it reads
   in both themes because every colour is either one of the product's four
   hues or a theme token, and nothing in it can go stale without somebody
   editing this file.

   Four lanes, because the interesting thing about this system is WHO does
   what: you hand it a file, the console breaks it up, the crew judges it,
   and Grafana is written to and then starts work of its own. There is
   deliberately no arrow from the publisher to the remediator -- the
   remediator is woken by the alert, and that gap is the point.

   The marks are the real ones where a real one exists: Agent Builder on
   the crew, Grafana on its lane, Loki and Mimir on the two stores. The
   models are named in text rather than dressed in a logo nobody shipped
   here. The Guard carries no model name because it has no model in it,
   which is the one thing worth noticing about it.

   Every element carries data-lit: the steps it belongs to. customs.js sets
   data-step on the <svg> and the stylesheet dims everything that is not
   part of that step, so the picture walks itself through the eight moves.
   The empty left half of the two lower lanes is the detail panel: one
   group per step, drawn from the product's own icons, showing what that
   step actually looks at. With no JavaScript it is a complete static
   diagram and the panel simply never appears. #}
<svg class="flowsvg" viewBox="0 0 1240 548" role="img"
     aria-label="What happens when you upload a commercial: the console
     ingests it, a crew of Agent Builder agents observes and judges it,
     Grafana with Loki and Mimir is written to and wakes the fix loop where
     Gemini Omni and Veo re-render the shot, and you get a verdict, a
     certificate and a localized master.">
  <defs>
    <marker id="fa" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7"
            markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0.6 L9 5 L0 9.4 z" fill="context-stroke"/>
    </marker>
  </defs>
  <text class="fl-lane" x="8" y="60">YOU</text>
  <line class="fl-sep" x1="118" y1="122" x2="1230" y2="122"/>
  <text class="fl-lane" x="8" y="170">CONSOLE</text>
  <image class="fl-mark" href="/static/logo.png" x="8" y="178" height="26" width="26"/>
  <line class="fl-sep" x1="118" y1="244" x2="1230" y2="244"/>
  <text class="fl-lane" x="8" y="292">THE CREW</text>
