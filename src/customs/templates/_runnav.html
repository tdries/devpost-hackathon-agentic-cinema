{% set run_state = {"done": "cleared", "error": "blocked", "running": "pending", "created": "pending"}.get(run.status, "pending") %}
<nav class="runnav">
  <div class="wrap screens">
    <a class="tab {% if screen == 'board' %}on{% endif %}" href="/runs/{{ run.id }}"><svg class="ic"><use href="#n-board"/></svg>Launch board</a>
    <a class="tab {% if screen == 'mission' %}on{% endif %}" href="/runs/{{ run.id }}/mission"><svg class="ic"><use href="#n-feed"/></svg>Mission feed</a>
    <a class="tab {% if screen == 'timeline' %}on{% endif %}" href="/runs/{{ run.id }}/timeline"><svg class="ic"><use href="#n-timeline"/></svg>Timeline</a>
    <a class="tab {% if screen == 'cutting' %}on{% endif %}" href="/runs/{{ run.id }}/cutting"><svg class="ic"><use href="#n-cut"/></svg>Cutting room</a>
  </div>
  <div class="wrap markets-row">
    {% for code in run.markets %}
    <a class="tab {% if screen == 'market' and market == code %}on{% endif %}" href="/runs/{{ run.id }}/markets/{{ code }}"><svg class="ic"><use href="#n-market"/></svg>{{ code }}</a>
    {% endfor %}
    <span class="runnav-right">
      <span class="runid">{{ run.id }}</span>
      <span class="pill s-{{ run_state }}"><svg class="ic"><use href="#i-{{ run_state.replace('_', '-') }}"/></svg>{{ run.status }}</span>
    </span>
  </div>
</nav>
